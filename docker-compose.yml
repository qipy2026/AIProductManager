services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENTOPS_STORAGE: sqlite
      SEMANTIC_BACKEND: chroma
      LLM_MODE: mock
      USE_LANGGRAPH: "1"
    volumes:
      - ./data:/app/data

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
